# Blueprint de deploy do backend no Render (https://render.com/docs/blueprint-spec).
# Cria o banco PostgreSQL e o serviço web do Django.

databases:
  - name: patri-tech-db
    databaseName: patritech
    user: patritech
    plan: free
    region: oregon

services:
  - type: web
    name: patri-tech-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: gunicorn projeto.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: patri-tech-db
          property: connectionString
      # Preencha no painel do Render com a URL do frontend na Vercel.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
